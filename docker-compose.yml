services:
  # Dịch vụ Cơ sở dữ liệu MySQL 8.0
  mysqldb:
    image: mysql:8.0
    container_name: soccerstore-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: WebBD_db
    ports:
      - "3306:3306"
    volumes:
      # Giữ lại dữ liệu trên ổ cứng máy thật
      - mysql_data:/var/lib/mysql
      # Tự động chạy toàn bộ file .sql trong thư mục database khi khởi tạo lần đầu
      - ./database:/docker-entrypoint-initdb.d

spring.application.name=backend
server.port=${SERVER_PORT:8080}

# Datasource: Docker/VPS truyen DB_URL, DB_USERNAME, DB_PASSWORD qua .env; local mac dinh localhost
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/WebBD_db?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA / Hibernate: khi chay that nen dat JPA_SHOW_SQL=false de giam tai I/O log
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# JWT: bat buoc dat JWT_SECRET rieng (>= 32 ky tu) trong .env khi deploy production
jwt.secret=${JWT_SECRET:9a4f2c8d3e71b5a8e6c8f921435d7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS: ngan cach nhieu domain bang dau phay (vd: https://shop.domain.com,http://localhost:3000)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
